# ─────────────────────────────────────────────────────
#  hyprlock.conf
# ─────────────────────────────────────────────────────

general {
    grace               = 0
    hide_cursor         = true
    no_fade_in          = false
    no_fade_out         = false
    ignore_empty_input  = false
}

# ── Background ────────────────────────────────────────
background {
    monitor           =
    path              = screenshot
    blur_passes       = 5
    blur_size         = 9
    brightness        = 0.65
    contrast          = 0.90
    vibrancy          = 0.18
    vibrancy_darkness = 0.15
}

# ═══════════════════════════════════════════════════
#  TOP REGION — clock block, top-anchored
# ═══════════════════════════════════════════════════

# ── Clock (HH:MM only — no sibling seconds label) ────
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    font_size   = 80
    font_family = JetBrains Mono, monospace
    position    = 0, -60
    halign      = center
    valign      = top
    color       = rgba(255, 255, 255, 0.92)
}

# ── Date — 160px below top, well outside clock bbox ──
#    At font_size=80, cap-height≈80px, descent≈20px,
#    clock bottom edge ≈ top+60+100 = pixel 160.
#    Placing date at -190 gives 30px clearance minimum.
label {
    monitor     =
    text        = cmd[update:60000] date +"%A · %d %B %Y" | awk '{print toupper($0)}'
    font_size   = 13
    font_family = sans-serif
    position    = 0, -190
    halign      = center
    valign      = top
    color       = rgba(255, 255, 255, 0.35)
}

# ═══════════════════════════════════════════════════
#  BOTTOM REGION — auth block, bottom-anchored
# ═══════════════════════════════════════════════════

# ── Prompt ────────────────────────────────────────────
label {
    monitor     =
    text        = ENTER PASSWORD
    font_size   = 10
    font_family = sans-serif
    position    = 0, 150
    halign      = center
    valign      = bottom
    color       = rgba(255, 255, 255, 0.20)
}

# ── Input field ───────────────────────────────────────
input-field {
    monitor           =
    size              = 280, 48
    position          = 0, 90
    halign            = center
    valign            = bottom

    outline_thickness = 1
    outer_color       = rgba(255, 255, 255, 0.10)
    inner_color       = rgba(255, 255, 255, 0.03)

    check_color       = rgba(120, 210, 150, 0.90)
    fail_color        = rgba(220, 85, 85, 0.90)
    fail_transition   = 300

    font_size         = 15
    font_family       = JetBrains Mono, monospace
    font_color        = rgba(255, 255, 255, 0.88)
    placeholder_color = rgba(255, 255, 255, 0.20)

    rounding          = 10
    placeholder_text  = enter password

    dots_center       = true
    dots_size         = 0.22
    dots_spacing      = 0.35
    dots_rounding     = -1
}

# ── Caps-lock warning ─────────────────────────────────
label {
    monitor     =
    text        = cmd[update:1000] [ "$(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | head -1)" = "1" ] && echo "CAPS LOCK ON" || echo ""
    font_size   = 10
    font_family = sans-serif
    position    = 0, 50
    halign      = center
    valign      = bottom
    color       = rgba(240, 175, 75, 0.75)
}
